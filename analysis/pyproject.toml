[project]
name = "tucsonmesh-quick-analysis"
version = "0.1.0"
description = "Scripts and notebooks for quick analysis of data generated by Tucson Mesh"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1.3",
    "ipywidgets>=8.1.8",
    "lonboard>=0.16.0",
    "polars>=1.39.3",
    "polars-st>=0.6.2",
    "shapely>=2.1.2",
]

[tool.uv.workspace]
members = ["projects/*"]

[dependency-groups]
dev = [
    "jupyterlab>=4.5.6",
]
